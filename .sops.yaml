creation_rules:
  - path_regex: jezrien/secrets.yaml$
    key_groups:
      - age:
          - *dusty
          - *jezrien
  - path_regex: taln/secrets.yaml$
    key_groups:
      - age:
          - *dusty
          - *taln
  - path_regex: homelab/secrets.yaml$
    key_groups:
      - age:
          - *dusty
          - *homelab
  - path_regex: vasher/secrets.yaml$
    key_groups:
      - age:
          - *dusty
          - *vasher
  - path_regex: hoid/secrets.yaml$
    key_groups:
      - age:
          - *dusty
          - *hoid
  # hoid's own age identity: only Dusty can decrypt it, and `pve-provision`
  # installs it into a freshly provisioned container. That is what lets
  # hoid/secrets.yaml be encrypted before the container exists.
  - path_regex: hoid/age-key.sops$
    key_groups:
      - age:
          - *dusty
  - path_regex: elantris/secrets.yaml$
    key_groups:
      - age:
          - *dusty
          - *elantris
  - path_regex: elantris/age-key.sops$
    key_groups:
      - age:
          - *dusty
