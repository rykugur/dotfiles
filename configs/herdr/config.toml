# Symlinked to ~/.config/herdr/config.toml by modules/ai/herdr.nix via
# mkOutOfStoreSymlink, so herdr can write it at runtime (onboarding state,
# toast/panel preferences). Runtime edits land here as a git diff — commit or
# revert them like any other dotfile.

[terminal]
default_shell = "nu"

# Herdr defaults to Catppuccin implicitly, but plugins can only inherit a theme
# named in config. Navigator maps this name to Catppuccin Mocha.
[theme]
name = "catppuccin"

[ui]
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
sidebar_width = 32
sidebar_max_width = 40
# Sorting stays "spaces", so rows of the same space stay adjacent; Herdr 0.9.1
# has no group headers.
agent_panel_sort = "spaces"

# Agent panel: two rows per agent. Row 1 is the locator (state icon / space /
# tab). Row 2 is the pane's terminal title, which omp sets to its session
# title, so the panel says what each agent is working on. The default row 2
# (agent kind) is dropped because every pane here runs omp.
# Two-row entries need a blank separator row to stay legible.
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { dim = true, token = "workspace" }, "tab"],
  ["terminal_title_stripped"],
]

[ui.sidebar.spaces]
row_gap = 1

[ui.toast]
delay_seconds = 1
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[keys]
previous_tab = ["prefix+h", "alt+h"]
next_tab = ["prefix+l", "alt+l"]
move_tab_previous = ["prefix+ctrl+h", "alt+shift+h"]
move_tab_next = ["prefix+ctrl+l", "alt+shift+l"]
focus_pane_left = ["prefix+shift+h", "ctrl+shift+h"]
focus_pane_down = ["prefix+shift+j", "ctrl+shift+j"]
focus_pane_up = ["prefix+shift+k", "ctrl+shift+k"]
focus_pane_right = ["prefix+shift+l", "ctrl+shift+l"]

[[keys.command]]
command = "herdr-navigator.open"
description = "jump to anything"
key = "prefix+t"
type = "plugin_action"
